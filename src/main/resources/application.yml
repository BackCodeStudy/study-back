spring:
  application:
    name: backCodeStudy

  datasource:
    url: jdbc:mysql://localhost:3306/auction?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update  # ?? ??? update, ????? validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  springdoc:
    default-consumes-media-type: application/json
    default-produces-media-type: application/json
    paths-to-match: /api/**
    swagger-ui:
      path: /api-test
      display-request-duration: true
      groups-order: DESC
      operations-sorter: method
      disable-swagger-default-url: false
      urls:
        - url: http://localhost:8080/v3/api-docs
          name: BackCodeStudy API Docs
    api-docs:
      groups:
        enabled: true

  security:
    user:
      name: admin
      password: admin